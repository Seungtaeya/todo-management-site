<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 작업 관리 홈 </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5" style="max-width: 800px;">

    <div id="login-info" th:data-member-id="${loginMemberId}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="mb-0">작업 관리 홈</h1>

                <div class="auth-menu d-flex align-items-center gap-2">
                    <a href="/register" class="btn btn-outline-secondary btn-sm" th:if="${session.loginMember == null}">회원가입</a>

                    <div th:if="${session.loginMemberName != null}">
                        <span class="fw-bold" th:text="${session.loginMemberName} +'님'"></span>
                    </div>

                    <a href="/login"
                       th:if="${session.loginMember == null}"
                       class="btn btn-primary btn-sm">로그인</a>

                    <a href="/logout"
                       th:if="${session.loginMember != null}"
                       class="btn btn-outline-danger btn-sm">로그아웃</a>
                </div>
            </div>

            <div class="todo mb-4">
                <a href="/Todo/new" class="btn btn-success">할 일 등록</a>
                <!-- <button class="my-todo-list">내 할 일 목록 조회</button> -->
            </div>

            <div class="todo mb-4">
                <button class="btn btn-outline-info" id="all" onclick="TodoBtnClick('all')">전체 조회</button>
                <button class="btn btn-outline-info" id="todo" onclick="TodoBtnClick('TODO')">할 일 조회</button>
                <button class="btn btn-outline-info" id="in_progress" onclick="TodoBtnClick('IN_PROGRESS')">진행중 조회</button>
                <button class="btn btn-outline-info" id="done" onclick="TodoBtnClick('DONE')">완료 조회</button>
            </div>

            <div th:if="${session.loginMember != null}" class="mb-3">
                <label>
                    <select id="select">
                        <option value="title">제목</option>
                        <option value="titleAndContent">제목+내용</option>
<!--                        <option value="status">상태</option>-->
                    </select>
                </label>
                <input id="search" placeholder="검색어를 입력하세요">
                <button type="button" id="search-Btn">검색</button>
            </div>

            <div>
                <h5 class="mb-3">내 할 일 목록</h5>

                <ul id="todo-list" class="list-group">

                </ul>
            </div>


        </div>
    </div>

</div>
<script th:inline="javascript">

    let loginInfo = document.getElementById("login-info");
    const ul = document.getElementById("todo-list");
    const message = /*[[${message}]]*/ null;
    const todo = document.getElementById("todo");
    let search = document.getElementById("search");
    const searchBtn = document.getElementById("search-Btn");
    const select = document.getElementById("select");

    console.log("flash message", message);
    if (message) {

        alert(message);

    }

    searchBtn.addEventListener("click",() => {
        const keyword = search.value.trim();
        fetch(`/api/todos/search?keyword=${encodeURIComponent(keyword)}&select=${select.value}`, {
            method: "GET"
        })
            .then(response => {
                if(!response.ok) {
                    alert("검색에 실패 했습니다.");
                    return;
                }

                return response.json();
            })
            .then(data => {
                ul.innerHTML = "";

                if(!data) return;

                data.forEach(todo => {
                    let statusText = extracted(todo);

                    const li = document.createElement("li");

                    li.className = "list-group-item";
                    li.innerHTML = `<a class="text-decoration-none" href="/todo/detail/${todo.id}">${todo.title} 진행 상태:${statusText}</a>`;
                    ul.appendChild(li);
                })

            })
    })

    function TodoBtnClick(status) {
        ul.innerHTML = "";
        fetch(`/api/todos/${status}`,{
            method: "GET"
        })
            .then(response => {
                if(!response.ok) {
                    alert("조회 하는데 실패 했습니다.");
                    return null;
                }

                return response.json();
            })
            .then(data => {
                if(!data) return;

                data.forEach(todo => {
                    let statusText = extracted(todo);

                    const li = document.createElement("li");

                    li.className = "list-group-item";
                    li.innerHTML = `<a class="text-decoration-none" href="/todo/detail/${todo.id}">${todo.title} 진행 상태:${statusText}</a>`;
                    ul.appendChild(li);
                })
            })
    }

    function extracted(todo) {
        let statusText = "";

        if (todo.status === "TODO") {
            statusText = "할 일";
        } else if (todo.status === "IN_PROGRESS") {
            statusText = "진행중";
        } else if (todo.status === "DONE") {
            statusText = "완료";
        }
        return statusText;
    }

    if(loginInfo) {
        fetch("/api/todos/my")
            .then(response => {
                // if(response.status === 401) {
                //     alert("로그인 해주세요")
                //     return;
                // }
                if(!response.ok) {
                    throw new Error("할 일 목록 조회 실패");
                }
                return response.json();
            })
            .then(data => {
                if(!data) return;

                data.forEach(todo => {
                    let statusText = "";

                    if(todo.status === "TODO") {
                        statusText = "할 일";
                    } else if(todo.status === "IN_PROGRESS") {
                        statusText = "진행중";
                    } else if(todo.status === "DONE") {
                        statusText = "완료";
                    }

                    const li = document.createElement("li");
                    li.className = "list-group-item";
                    li.innerHTML = `<a class="text-decoration-none" href="/todo/detail/${todo.id}">${todo.title} 진행 상태:${statusText}</a>`;
                    ul.appendChild(li);
                })


            })
            .catch(error=> {
                console.log(error);
            });
    }
</script>
</body>
</html>
