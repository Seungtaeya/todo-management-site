<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할 일 작성</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5" style="max-width: 720px;">

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <a href="/" class="text-decoration-none">
                <h1 class="mb-4">할 일 작성</h1>
            </a>

            <form action="/Todo/new" method="post" class="todo-Form">

                <div class="mb-3">
                    <label for="title" class="form-label">제목</label>
                    <input id="title"
                           name="title"
                           placeholder="제목"
                           class="form-control title">
                </div>

                <div class="mb-3">
                    <label for="content" class="form-label">내용</label>
                    <textarea id="content"
                              name="content"
                              placeholder="할 일 작성해주세요"
                              class="form-control content"
                              rows="6"></textarea>
                </div>

                <div class="mb-3">
                    <label for="status" class="form-label">상태</label>
                    <select id="status" name="status" class="form-select">
                        <option disabled selected>옵션 선택</option>
                        <option value="TODO" name="status">할 일</option>
                        <option value="IN_PROGRESS" name="status">진행 중</option>
                        <option value="DONE" name="status">완료</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="dueDate" class="form-label">마감일</label>
                    <input id="dueDate"
                           type="date"
                           name="dueDate"
                           th:value="${today}"
                           class="form-control">
                </div>

                <button type="submit" class="btn btn-success todo-saveBtn">
                    저장
                </button>

            </form>

        </div>
    </div>

</div>

<script th:inline="javascript">
    const message = /*[[${message}]]*/ null;

    if(message) {
        alert(message);
    }

</script>

</body>
</html>
